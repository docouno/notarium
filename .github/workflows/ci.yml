name: CI

on:
  push:
    branches: [v1]
  pull_request:
    branches: [v1]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DEVKIT_CACHE_DIR: ${{ runner.temp }}/devkit-cache
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-compose-action@v2.4.0
        with:
          version: v5.0.2
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ runner.temp }}/devkit-cache
            .devkit/cache
          key: devkit-${{ runner.os }}-${{ hashFiles('.devkit/manifest.json', 'pnpm-lock.yaml', 'apps/api/Cargo.lock') }}
          restore-keys: |
            devkit-${{ runner.os }}-
      - run: sh .devkit/runtime/devkit.sh cli doctor .
      - run: make setup
      - run: make doctor
      - run: make check
      - run: make test
      - run: make build
