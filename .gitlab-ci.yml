# Notarium CI — GitLab side.
#
# This file is an ADAPTER, not the contract. What a gate actually runs lives in
# package.json scripts, so a second provider can call the same commands without
# reimplementing them in a second YAML that nobody diffs against this one. If a step
# here is anything more interesting than `npm run <script>`, that is a smell: the
# logic belongs in a repo script.
#
# Two lanes, deliberately different in cost and in what they promise:
#
#   lean      — the fast contract on the no-embedder profile. What every change gets.
#               It DOES exercise vec0: the extension installs in every profile, and a
#               red vector suite here is a real answer about the change, not an
#               environment artefact (#317).
#   extended  — the full-dependency, live-service, browser and image layers. Runs on
#               the events that can change its answer — a release tag, a rehearsal
#               tag, or a change landing on the default branch — and on demand
#               anywhere else.
#
# STAGES ARE BARRIERS, and that is the whole reason the lean jobs share one. Split
# across stages, a lint error would mean the tests never run and you would learn
# about a type error only on the next push. Jobs that should report together sit
# together; stages separate only real dependencies: code is green, THEN the built
# image proves itself, THEN anything is published, THEN it is rolled out.
#
# `deploy` is declared and empty on purpose: rolling a build out is currently an
# operator step rather than a job, and YAML that cannot run is not a head start.
#
# What the runner has to provide, and the rest of the reasoning: docs/ci.md

workflow:
  rules:
    # One pipeline per change: the MR pipeline, not also a duplicate branch pipeline.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    # Two tag shapes carry meaning, and only these two: `vX.Y.Z` / `vX.Y.Z-rc.N` is a
    # release, `ci/<label>` is a disposable rehearsal of the full gate. Any other tag
    # is a bookmark and gets no pipeline — a bare `$CI_COMMIT_TAG` here would make
    # every bookmark fire the 40-minute heavy lane.
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/
    - if: $CI_COMMIT_TAG =~ /^ci\//
    - if: $CI_PIPELINE_SOURCE == "web"

stages: [lean, extended, verify, release, deploy]

default:
  interruptible: true

# npm's own cache, keyed by the lockfile. NOT node_modules — restoring a tree of
# symlinked workspaces from a tarball is slower and less honest than `npm ci`.
.npm-cache:
  variables:
    npm_config_cache: .npm
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm]

# dind over TLS. Needs /certs/client shared between this container and the service,
# which is a runner-config property rather than a job one — see docs/ci.md. Only lanes
# that BUILD images need it: the browser lane runs in the Playwright image directly,
# because inside dind that image would be re-pulled on every run (2.3 GB).
.dind:
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: '1'
    DOCKER_CERT_PATH: /certs/client

# Explicit all-host diagnostics remain mutually exclusive. Automatic jobs use the two
# slice groups below instead; mixing the old coarse lock into one half would not reserve
# it from jobs that own the new group.
.heavy:
  resource_group: heavy

# Affinity chooses a capacity-relative slice inside one job, but it does not reserve that
# slice from another pipeline. These project-global groups are the admission boundary:
# every automatic CPU-heavy job owns logical half A or B, while the repo profile maps
# those names onto the first/second half of whatever cpuset the runner actually allows.
.ci-lane-a:
  resource_group: notarium-ci-lane-a

.ci-lane-b:
  resource_group: notarium-ci-lane-b

# WHEN the extended lane runs, by EVENT — never on a timer. Its inputs are pinned (base
# image by digest, dependencies by lockfile), so the same commit renders the same answer
# a week later; what changes the answer is a change landing or a release being cut.
#
# The on-demand fallback is deliberately allow_failure: a BLOCKING manual job leaves
# every pipeline sitting unfinished, waiting for a click nobody owes it.
.extended-rules:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/
    - if: $CI_COMMIT_TAG =~ /^ci\//
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true

# --- lean --------------------------------------------------------------------
# The verdicts a change gets share ONE stage, so a single push reports all of them. They
# each pay their own `npm ci`, which the npm cache makes cheap; what that buys is that a
# lint error no longer hides whether the tests pass.
.lean:
  stage: lean
  extends: .npm-cache
  # node:24, NOT node:24-slim: `npm test` drives the real Makefile in
  # test/backup/makefile.test.ts, and slim ships no make — the suite fails there on an
  # archive that was never produced.
  image: node:24
  before_script:
    # The declared npm. The base image ships one below the floor package.json sets, so
    # under engine-strict the `npm ci` below cannot run until this line has done its
    # work — the pin is load-bearing and needs no checker of its own. The number is
    # derived from `packageManager`; the pattern anchors the whole `npm@<x.y.z>` shape,
    # because a bare split accepts `npm@latest` and `npm@ `.
    #
    # The block carries its own `set -eu` and chains nothing with `&&`, so it aborts on
    # the spot no matter what surrounds it or follows it. That independence is the point:
    # the same shape is copied into `docker/Dockerfile` and the `make` runners, where the
    # harness supplies neither. Relying on the caller is what broke twice before — a
    # failure inside an and-list is ignored by `set -e`, and the runner does not check
    # status per line either (FF_ENABLE_BASH_EXIT_CODE_CHECK is off by default).
    #
    # It goes FIRST, before the chown: .npm-cache puts npm_config_cache inside
    # $CI_PROJECT_DIR, so installing as root afterwards leaves root-owned cache entries
    # that the su'd `npm ci` then refuses outright. It also cannot be wrapped in
    # `su node -c '…'` — the expression carries single quotes that would close it.
    - |
      set -eu
      pinned_npm="$(node -p "(/^npm@([0-9]+[.][0-9]+[.][0-9]+([-][0-9A-Za-z.-]+)?)([+].*)?$/.exec(require('./package.json').packageManager)||[,''])[1]")"
      [ -n "$pinned_npm" ] || { echo 'package.json packageManager must be npm@<x.y.z>' >&2; exit 1; }
      npm i -g "npm@$pinned_npm"
      npm -v
    # Run UNPRIVILEGED. The data-root boot guard is covered by tests that chmod a
    # directory to 0o500 and require the write to be refused — root ignores that, so as
    # root the guard silently proves nothing. GitLab clones as root, hence the chown.
    - chown -R node:node "$CI_PROJECT_DIR"
    - su node -c 'node scripts/checkup/profile.mjs --plan "$CHECKUP_RESOURCE_PLAN" --lane "$CHECKUP_RESOURCE_LANE" npm run deps:lean'
  after_script:
    # Hand the checkout back: the build directory is per runner slot, not per job, so an
    # ownership change outlives the job that needed it. A later job on the same slot
    # would inherit a tree owned by uid 1000 while running as root, and git 2.35+ refuses
    # such a repository outright ("detected dubious ownership").
    - chown -R root:root "$CI_PROJECT_DIR" || true

# Cheapest signal, and the one a contributor is most likely to trip. Kept as separate
# lines so the log names the failing check rather than a shell chain.
lean:static:
  extends: [.lean, .ci-lane-b]
  variables:
    CHECKUP_RESOURCE_PLAN: ci-lean-wave1
    CHECKUP_RESOURCE_LANE: static
  script:
    - su node -c 'node scripts/checkup/profile.mjs --plan "$CHECKUP_RESOURCE_PLAN" --lane static npm run check:static'
  artifacts:
    when: always
    expire_in: 3 days
    access: developer
    paths:
      - test-results/checkup-static.json

lean:unit:
  extends: [.lean, .ci-lane-a]
  variables:
    CHECKUP_RESOURCE_PLAN: ci-lean-wave1
    CHECKUP_RESOURCE_LANE: coverage
  script:
    - su node -c 'npm run test:coverage'
    - su node -c 'node scripts/checkup/ciReports.mjs'
  coverage: '/^Lines\s*:\s*[0-9]+(?:\.[0-9]+)?%/'
  artifacts:
    when: always
    expire_in: 7 days
    access: developer
    reports:
      junit: test-results/vitest-junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - test-results/vitest-junit.xml
      - coverage/cobertura-coverage.xml

# Answers, in seconds, the one question whose answer otherwise arrives forty minutes
# later: can this ref publish at all? The registry credential is a protected variable,
# so on a tag that is not protected it does not exist — and without this job you learn
# that only after the whole gate has run and you have already pressed the button.
lean:release-preflight:
  stage: lean
  image: alpine:3
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/
  script:
    - |
      if [ -z "$DOCKERHUB_TOKEN" ]; then
        echo "preflight: DOCKERHUB_TOKEN is not visible on this ref."
        echo "preflight: it is a protected variable, so the tag pattern has to be protected too."
        exit 1
      fi
      echo "preflight: release credential is present on this ref"

# Proves the production bundle compiles and stays within its per-chunk budget. Independent
# of the suite — a change can break exactly one of the two, and each should say so on its own.
lean:build:
  extends: [.lean, .ci-lane-b]
  needs:
    - job: lean:static
      artifacts: false
  variables:
    CHECKUP_RESOURCE_PLAN: ci-lean-wave2
    CHECKUP_RESOURCE_LANE: build
  script:
    - su node -c 'node scripts/checkup/profile.mjs --plan "$CHECKUP_RESOURCE_PLAN" --lane build npm run build'

# --- extended ----------------------------------------------------------------
# The ordinary corpus and its comparable metric run once in lean:unit. This job proves
# only what needs the full dependency tree: the two native-package cases, the production
# image build, and graph-revision. It waits for lean coverage and never repeats 8k tests.
extended:unit:
  stage: extended
  extends: [.dind, .ci-lane-a, .extended-rules]
  # Repo-owned coverage/profile/graph scripts require the declared Node >=24.
  # Add the Docker client side to that runtime; the service still owns the daemon.
  image: node:24-alpine
  needs:
    - job: lean:static
      artifacts: false
    - job: lean:unit
      artifacts: false
    - job: lean:build
      artifacts: false
  variables:
    CHECKUP_RESOURCE_PLAN: ci-extended-wave1
    CHECKUP_RESOURCE_LANE: coverage
  script:
    - apk add --no-cache bash docker-cli docker-cli-buildx docker-cli-compose make util-linux-misc
    # The dind daemon is a sibling service and does not inherit this job's taskset.
    # BuildKit therefore owns an explicit builder container on the same CPU half.
    - BUILDX_BUILDER="notarium-ci-$CI_JOB_ID" node scripts/checkup/profile.mjs
      --plan "$CHECKUP_RESOURCE_PLAN" --lane coverage
      node scripts/checkup/ciDockerBuilder.mjs create --name "notarium-ci-$CI_JOB_ID"
    - BUILDX_BUILDER="notarium-ci-$CI_JOB_ID" docker build
      --target test -t "notarium-test:$CI_COMMIT_SHORT_SHA" -f docker/Dockerfile .
    - node scripts/checkup/profile.mjs --plan "$CHECKUP_RESOURCE_PLAN" --lane coverage
      node scripts/checkup/ciFullDeps.mjs --image "notarium-test:$CI_COMMIT_SHORT_SHA" --container "notarium-test-run-$CI_JOB_ID"
    - BUILDX_BUILDER="notarium-ci-$CI_JOB_ID" node scripts/checkup/profile.mjs
      --plan "$CHECKUP_RESOURCE_PLAN" --lane coverage
      make graph-revision-gate GRAPH_REVISION_COMMIT="$CI_COMMIT_SHA"
  after_script:
    - node scripts/checkup/ciDockerBuilder.mjs remove --name "notarium-ci-$CI_JOB_ID" || true
    - docker rm -f "notarium-test-run-$CI_JOB_ID" || true
    - docker image rm -f "notarium-test:$CI_COMMIT_SHORT_SHA" || true

# Candidate-only normalized orchestration rehearsal. Both detached subjects use the
# exact candidate bytes; only the candidate driver's legacy/candidate phase DAG differs.
# This removes known historical correctness/runtime flakes from the speed denominator,
# while scheduler/resource-group queue stays outside execution wall.
checkup:compare:
  stage: extended
  extends: [.dind, .heavy]
  # The docker CLI image's Alpine repository currently carries Node 22, while the
  # repository is engine-strict on Node >=24. Start from the declared runtime and
  # add only the Docker client side; the dind service remains the same daemon.
  image: node:24-alpine
  # One warm-up plus 3x2 measured full runs is about 160 minutes on the reference
  # runner. Keep a finite ceiling with enough room for cleanup and cache variance.
  timeout: 4h
  rules:
    - if: $CI_COMMIT_TAG =~ /^ci\//
      when: manual
      allow_failure: true
    - when: never
  script:
    - apk add --no-cache bash docker-cli docker-cli-buildx docker-cli-compose git make
    - npm i -g "npm@$(node -p "require('./package.json').packageManager.slice(4)")"
    - npm run deps:lean
    - node scripts/checkup/compare.mjs --base "$CI_COMMIT_SHA" --candidate "$CI_COMMIT_SHA" --runs "${CHECKUP_COMPARE_RUNS:-3}" --warmups "${CHECKUP_COMPARE_WARMUPS:-1}"
  artifacts:
    when: always
    expire_in: 7 days
    access: developer
    paths:
      - test-results/checkup-compare.json
      - test-results/checkup-compare-runs/

# PostgreSQL and visual are independent 2-CPU children of one 4-CPU GitLab job. Keeping
# them under one project-global reservation preserves their parallelism without asking
# two separate jobs to acquire the same resource group (which would serialize them).
extended:postgres+visual:
  stage: extended
  extends: [.npm-cache, .ci-lane-b, .extended-rules]
  image: mcr.microsoft.com/playwright:v1.60.0-jammy
  needs:
    - job: lean:static
      artifacts: false
    - job: lean:build
      artifacts: false
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    CI: '1'
    CHECKUP_RESOURCE_PLAN: ci-extended-wave1
    CHECKUP_RESOURCE_LANE: wave
    POSTGRES_USER: notarium
    POSTGRES_PASSWORD: notarium
    POSTGRES_DB: notarium_test
    TEST_PG_URL: postgres://notarium:notarium@postgres:5432/notarium_test
    # Playwright's JSON report, rather than leftover screenshots, distinguishes a real
    # diff from a failed attempt or retry-pass.
    PLAYWRIGHT_JSON_OUTPUT_NAME: visual-report.json
  script:
    # The declared npm — see the .lean pin above for why this line exists.
    - |
      set -eu
      pinned_npm="$(node -p "(/^npm@([0-9]+[.][0-9]+[.][0-9]+([-][0-9A-Za-z.-]+)?)([+].*)?$/.exec(require('./package.json').packageManager)||[,''])[1]")"
      [ -n "$pinned_npm" ] || { echo 'package.json packageManager must be npm@<x.y.z>' >&2; exit 1; }
      npm i -g "npm@$pinned_npm"
      npm -v
    - node scripts/checkup/profile.mjs --plan "$CHECKUP_RESOURCE_PLAN" --lane wave npm run deps:lean
    - node scripts/checkup/ciExtendedWave1.mjs run
  artifacts:
    when: always
    expire_in: 3 days
    access: developer
    reports:
      dotenv: review.env
    paths:
      - visual-handoff.json
      - playwright-report/
      - test-results/

# The producer above must stay green after it has written both artifacts: a red producer
# cannot hand visual evidence to its independent gate. This fast job owns the PG/infra
# verdict from the aggregate report; pixel diffs and retries remain visual:gate's concern.
extended:postgres+visual:gate:
  stage: extended
  image: node:24-slim
  needs:
    - job: extended:postgres+visual
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/
      when: always
    - if: $CI_COMMIT_TAG =~ /^ci\//
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: manual
      allow_failure: true
  script:
    - node scripts/checkup/ciExtendedWave1.mjs gate

# #414's corpus/latency/recovery benchmark is intentionally an on-demand load acceptance:
# unlike the ordinary PG contracts it owns two resource-capped app/DB containers,
# materializes the pinned pre tree, and runs the 2M-depth/breadth variants. It must not
# extend every main/release pipeline or occupy the shared heavy slot without an operator.
# The CI adapter delegates all mechanics and the verdict to the same Make target used locally.
extended:activity-groups:
  stage: extended
  extends: [.dind, .heavy]
  rules:
    - when: manual
      allow_failure: true
  # The complete profile has exceeded thirty minutes on the reference runner. Keep a
  # finite load-test ceiling; each child phase still fails independently after eight.
  timeout: 1h
  # The gate archives its immutable main@4d824c3 comparison tree. A shallow
  # default-branch/tag checkout eventually drops that object and would fail before
  # measurement, so this lane owns the same full-history requirement as release.
  variables:
    GIT_DEPTH: 0
  script:
    # docker:27-cli is Alpine and does not ship the shell declared by the Makefile.
    - apk add --no-cache bash git make nodejs-current
    - make activity-groups-gate ACTIVITY_GROUPS_GATE_MODE=full
  artifacts:
    when: always
    expire_in: 7 days
    access: developer
    paths:
      - test-results/activity-groups-gate/full/report.json

# The pinned Playwright image IS the job image: the runner pulls it to its host once and
# reuses it, and the render matches the baselines because the browser, fonts and system
# libraries are the ones the image ships.
extended:e2e:
  stage: extended
  extends: [.npm-cache, .ci-lane-b, .extended-rules]
  image: mcr.microsoft.com/playwright:v1.60.0-jammy
  # The dependencies are resource barriers, not correctness prerequisites. A red PG
  # still releases its slice and must not hide the independent browser verdict.
  when: always
  # PostgreSQL and visual release lane B before the multi-project browser contour takes
  # that whole half. Coverage may still be running on lane A; the waves stay disjoint.
  needs:
    - job: extended:postgres+visual
      artifacts: false
  variables:
    CI: '1'
    CHECKUP_RESOURCE_PLAN: ci-extended-wave2
    CHECKUP_RESOURCE_LANE: browser
  script:
    # The declared npm — see the .lean pin above for why this line exists.
    - |
      set -eu
      pinned_npm="$(node -p "(/^npm@([0-9]+[.][0-9]+[.][0-9]+([-][0-9A-Za-z.-]+)?)([+].*)?$/.exec(require('./package.json').packageManager)||[,''])[1]")"
      [ -n "$pinned_npm" ] || { echo 'package.json packageManager must be npm@<x.y.z>' >&2; exit 1; }
      npm i -g "npm@$pinned_npm"
      npm -v
    - node scripts/checkup/profile.mjs --plan "$CHECKUP_RESOURCE_PLAN" --lane browser npm run deps:lean
    - npm run e2e
  artifacts:
    when: always
    expire_in: 3 days
    # Traces and screenshots of the running product. `all` would hand them to anyone who
    # can read the repository, which is the wrong default once it is public.
    access: developer
    paths:
      - playwright-report/
      - test-results/

# The verdict, and the only thing here that is allowed to be red. It reads the fixed
# schema-versioned handoff artifact; dotenv remains informational because higher-
# precedence manual/project variables can override it.
#
# THREE numbers, because they are three different verdicts. Pixels that moved are looked
# at and accepted; a test that failed without producing a screenshot has nothing to
# accept; and a retry-pass is a diagnostic flake that stays red. Collapsing them would
# let a timeout or retry pass for "no diffs".
#
# Two mechanisms, because they answer different halves:
#
#   rules  — WHERE the job appears. The same events as the comparison, so a merge request
#            that only ran lean carries no visual verdict at all rather than a green one.
#            Spelled out instead of extending .extended-rules: this job runs `always` and
#            that rule set does not.
#   needs  — WHETHER it can speak. Tied to the comparison, so a run that died before
#            reporting skips the gate instead of reading a missing handoff as zero.
visual:gate:
  stage: verify
  image: node:24-slim
  needs:
    - job: extended:postgres+visual
      artifacts: true
  # `always`, not `on_success`: a red e2e in the same stage must not swallow the pixel
  # verdict — the two report on different things.
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/
      when: always
    - if: $CI_COMMIT_TAG =~ /^ci\//
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: manual
      allow_failure: true
  script:
    - node scripts/visualBaseline.mjs gate --if-present

# --- verify ------------------------------------------------------------------
# Where the built ARTEFACT proves itself, as opposed to the source. Its own stage because
# the dependency is real: there is no point interrogating an image built from code whose
# own suite is red.

# The one privileged act in the whole visual lane, and it does nothing but move a pointer
# at pixels that were rendered, uploaded and looked at earlier. No render, no recompute —
# approving something other than what was reviewed is the failure this separation exists
# to make impossible. It addresses the candidate by commit, so it cannot bless a newer
# push by accident. Acceptance exists only on the protected default branch: rehearsal
# refs have no writer credential/candidate and must never offer a button that cannot work.
visual:accept:
  stage: verify
  image: node:24-slim
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - when: never
  resource_group: visual-baseline-accept
  # The exact producer/base/snapshot identity comes from the fixed handoff artifact. A
  # recomputed or environment-overridden slug cannot redirect this privileged move.
  needs:
    - job: extended:postgres+visual
      artifacts: true
  variables:
    VISUAL_S3_KEY_ID: $VISUAL_S3_WRITE_KEY_ID
    VISUAL_S3_SECRET: $VISUAL_S3_WRITE_SECRET
  script:
    # No install: the protocol is two dependency-free modules over node's own crypto.
    - node scripts/visualBaseline.mjs accept

# Destructive backup → fresh-volume restore against the real runtime image, plus the
# durable-import fixture off the builder stage. The adapter rule applied literally: the
# builds, the image lifecycle and the cleanup all live in `make backup-smoke`, so this job
# is the one command — see docs/ci.md for why `bash` is in the package set.
verify:backup-smoke:
  stage: verify
  extends: [.dind, .ci-lane-a, .extended-rules]
  needs:
    - job: extended:unit
      artifacts: false
  variables:
    CHECKUP_RESOURCE_PLAN: ci-heavy-tail
    CHECKUP_RESOURCE_LANE: backup
  script:
    - apk add --no-cache nodejs make bash util-linux-misc
    - BUILDX_BUILDER="notarium-ci-$CI_JOB_ID" node scripts/checkup/profile.mjs
      --plan "$CHECKUP_RESOURCE_PLAN" --lane backup
      node scripts/checkup/ciDockerBuilder.mjs create --name "notarium-ci-$CI_JOB_ID"
    - BUILDX_BUILDER="notarium-ci-$CI_JOB_ID" node scripts/checkup/profile.mjs
      --plan "$CHECKUP_RESOURCE_PLAN" --lane backup make backup-smoke
  after_script:
    - node scripts/checkup/ciDockerBuilder.mjs remove --name "notarium-ci-$CI_JOB_ID" || true

# The release entrypoint's own drill: the real `scripts/releaseImage.mjs`, publishing a
# pre-release into a throwaway registry. It needs no external credentials and publishes
# nothing public, which is exactly why it can run on every extended pass — the parts it
# covers (the immutability gate, the digest read-back, the version→latest ordering, the
# live /api/about interrogation) would otherwise be met for the first time during a real
# release.
#
# The driver owns the registry topology, because the driver is what knows where the
# daemon is — see test/release/smoke.mjs. The registry has to stay addressable as
# `localhost`: that is the one name both halves of the flow accept over plain HTTP, and
# the client-side half (`buildx imagetools inspect`) has no --insecure flag at all.
verify:release-smoke:
  stage: verify
  extends: [.dind, .ci-lane-a, .extended-rules]
  needs:
    - job: verify:backup-smoke
      artifacts: false
  variables:
    CHECKUP_RESOURCE_PLAN: ci-heavy-tail
    CHECKUP_RESOURCE_LANE: release
  script:
    # git for `git archive` (the build context is the revision, never the checkout); npm
    # because the release gate re-audits the EXPORTED dependency graph before it builds.
    - apk add --no-cache nodejs npm git util-linux-misc
    # The build directory belongs to the runner slot and is walked by jobs running as
    # different users, and git 2.35+ refuses a repository whose owner is not the current
    # user. A lane that reads the revision has to say out loud that this directory is
    # trusted — otherwise which slot it lands on decides whether it passes.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - BUILDX_BUILDER="notarium-ci-$CI_JOB_ID" node scripts/checkup/profile.mjs
      --plan "$CHECKUP_RESOURCE_PLAN" --lane release
      node scripts/checkup/ciDockerBuilder.mjs create --name "notarium-ci-$CI_JOB_ID"
    - BUILDX_BUILDER="notarium-ci-$CI_JOB_ID" node scripts/checkup/profile.mjs
      --plan "$CHECKUP_RESOURCE_PLAN" --lane release
      node test/release/smoke.mjs
  after_script:
    - node scripts/checkup/ciDockerBuilder.mjs remove --name "notarium-ci-$CI_JOB_ID" || true

# --- release -----------------------------------------------------------------
# Publishing is a HUMAN act on a tree the gate has already passed. Being in this stage is
# what enforces that: `release` runs after `verify`, so a red gate means the button is
# never reachable — nothing has to cross-check "was this revision verified", because the
# run that verifies it is the run that publishes it.
#
# The credential is a protected variable, so it does not exist on an unprotected ref by
# construction. The lane checks for it explicitly anyway: an empty token would otherwise
# reach `docker login` and fail with an authentication error, which reads like a wrong
# password rather than "you are on the wrong ref".
#
# allow_failure: false is NOT redundant. A `when: manual` rule defaults to allowing
# failure, and a release that fails while the pipeline stays green is exactly the wrong
# way round.
#
# interruptible: false, against the global default. The window auto-cancel would land in
# is the one scripts/releaseImage.mjs calls past the point of no return: killed between
# the push and the record, a candidate is published whose digest exists nowhere, because
# release.json is the only place it is written down.
.release-lane:
  stage: release
  extends: [.dind, .ci-lane-a]
  interruptible: false
  variables:
    CHECKUP_RESOURCE_PLAN: ci-heavy-tail
    CHECKUP_RESOURCE_LANE: release
  before_script:
    - apk add --no-cache nodejs npm git util-linux-misc
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - |
      if [ -z "$DOCKERHUB_TOKEN" ]; then
        echo "release: no Docker Hub credential here — DOCKERHUB_TOKEN is protected and this ref is not."
        exit 1
      fi
    - echo "$DOCKERHUB_TOKEN" | docker login -u "${DOCKERHUB_USER:-docouno}" --password-stdin
    - BUILDX_BUILDER="notarium-ci-$CI_JOB_ID" node scripts/checkup/profile.mjs
      --plan "$CHECKUP_RESOURCE_PLAN" --lane release
      node scripts/checkup/ciDockerBuilder.mjs create --name "notarium-ci-$CI_JOB_ID"
  after_script:
    - node scripts/checkup/ciDockerBuilder.mjs remove --name "notarium-ci-$CI_JOB_ID" || true
    - docker logout || true
  # The record carries the published tag and the digest the registry accepted. It is the
  # artifact identity, and the only place it exists after the job log expires.
  artifacts:
    when: always
    expire_in: 90 days
    access: developer
    paths:
      - release.json

# A ref raises AT MOST ONE of these two buttons, and that is a safety property, not
# tidiness: offered side by side, the row above the one you wanted publishes a candidate
# into the public registry under a number nobody decided to spend.
release:rc:
  extends: .release-lane
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
      when: manual
      allow_failure: false
  script:
    - BUILDX_BUILDER="notarium-ci-$CI_JOB_ID" node scripts/checkup/profile.mjs
      --plan "$CHECKUP_RESOURCE_PLAN" --lane release
      node scripts/releaseImage.mjs --prerelease --json | tee release.json

# The release proper. A separate job rather than a flag on the one above, for the same
# reason `make release` and `make release-rc` are separate targets: the two promise
# different things — an immutable `:X.Y.Z` that moves `:latest` versus a candidate that
# touches neither — and that difference must not hang on a typo in an argument.
#
# ONLY on a `vX.Y.Z` tag. The gate refuses unless the tag names exactly HEAD, so a branch
# run could never pass — better to not offer the button than to offer one that always
# fails. `-rc.N` is excluded for the mirror-image reason: a candidate tag names a
# pre-release, and publishing it as the release would claim a version the gate never saw.
#
# GIT_DEPTH: 0, against the runner default. This lane resolves the tag locally — which
# commit it names, and the build context exported from it with `git archive <tag>`. A
# shallow fetch promises neither, and a squash root makes a full clone cost one commit.
release:publish:
  extends: .release-lane
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
      allow_failure: false
  script:
    - BUILDX_BUILDER="notarium-ci-$CI_JOB_ID" node scripts/checkup/profile.mjs
      --plan "$CHECKUP_RESOURCE_PLAN" --lane release
      node scripts/releaseImage.mjs --json | tee release.json
