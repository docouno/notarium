[package]
name = "notarium-projections"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-support = []

[lints]
workspace = true

[dependencies]
notarium-core = { workspace = true }
notarium-syntax = { workspace = true }
notarium-canonical = { workspace = true }
croaring = { workspace = true }
memmap2 = { workspace = true }
arc-swap = { workspace = true }
blake3 = { workspace = true, features = ["rayon"] }
getrandom = { workspace = true }
hex = { workspace = true }
rmp-serde = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
same-file = { workspace = true }

[dev-dependencies]
notarium-canonical = { workspace = true, features = ["test-support"] }
notarium-projections = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
