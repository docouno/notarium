<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Notarium brand mark: the IconBrain glyph (src/core/Icons) in white on the
       accent purple (#6d4ee0, tokens.scss). Placeholder identity for the PWA icon
       set (#40) — coherent with the in-app brand; swap for the real branding/
       mascot when #14/#92 land. This file is BOTH the SVG favicon shipped to the
       browser AND the single source the icon set is generated from
       (pwa-assets.config.ts → `npm run pwa:assets -w @notarium/web`). The brain is
       centred at ~47% height so it stays inside the maskable safe zone. -->
